name: Verify

# Runs on every push, on pull requests, and once a week so a problem that
# appears without anyone touching the code still gets noticed.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 13 * * 1'   # Mondays, 08:00 America/Chicago
  workflow_dispatch:

jobs:
  verify:
    name: Privacy, crisis contacts, lock, offline, erase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Release checks
        run: python3 .github/scripts/compass_check.py
